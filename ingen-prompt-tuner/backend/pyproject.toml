[project]
name = "ingen-prompt-tuner"
version = "0.1.0"
description = "Ingen Prompt Tuner - AI orchestration backend hosting Ingenious agent flows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",  # Azure OpenAI SDK
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingen_prompt_tuner"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
