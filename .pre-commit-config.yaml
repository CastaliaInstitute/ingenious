# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      # Reformat Flask/Jinja templates
      - id: djlint-reformat-jinja
        files: "\\.(html|jinja)$"
        types_or: ["html", "jinja"]
      # Lint Flask/Jinja templates
      - id: djlint-jinja
        files: "\\.(html|jinja)$"
        types_or: ["html", "jinja"]
  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: ["--fix", "--extend-select=I,D", "--ignore=E402"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
  # Dead code detection with vulture
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: ['ingenious/', 'vulture_whitelist.py', '--min-confidence=80', '--exclude=tests,conftest']
  # Static type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [pydantic, pydantic-settings, fastapi]
  # Code complexity monitoring with xenon (wraps radon)
  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon
        args: ['--max-absolute=B', '--max-modules=B', '--max-average=A', '--exclude=ingenious/config/auth_config.py,ingenious/api/routes/custom_workflows.py,ingenious/api/routes/custom_workflows_introspection.py,ingenious/api/routes/custom_workflows_schema.py']
  # Security issue detection with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: '1.8.6'
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
