# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      # Reformat Flask/Jinja templates
      - id: djlint-reformat-jinja
        files: "\\.(html|jinja)$"
        types_or: ["html", "jinja"]
      # Lint Flask/Jinja templates
      - id: djlint-jinja
        files: "\\.(html|jinja)$"
        types_or: ["html", "jinja"]
  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: ["--fix", "--extend-select=I,D", "--ignore=E402"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
  # Static type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [pydantic, pydantic-settings, fastapi, typer, click]
  # Security issue detection with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: '1.8.6'
    hooks:
      - id: bandit
        # Only fail on medium+ severity; config in pyproject.toml
        args: ['-c', 'pyproject.toml', '-ll']
        additional_dependencies: ['bandit[toml]']
